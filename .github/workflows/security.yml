name: Security Pipeline 

on:
  push:
    branches:
      - main 
  
  pull_request: 

jobs: 
  secret-scan:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository 
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0


      - name: Run Gitleaks 
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
  
  sast: 
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name:  Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep 
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
    
  filesystem-scan: 
    runs-on: ubuntu-latest 
    needs: sast

    steps:
      - name: Checkout Repository 
        uses: actions/checkout@v4 

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig 
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  image-scan: 
    runs-on: ubuntu-latest
    needs: filesystem-scan 


    steps:
    - name: Checkout Repository 
      uses: actions/checkout@v4

    - name: Build Juice Shop Image 
      run: |
        docker pull bkimminich/juice-shop:latest
        docker tag bkimminich/juice-shop:latest secure-cicd-juice-shop:latest

    - name: Scan Docker Image 
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: secure-cicd-juice-shop:latest
        format: table
        severity: HIGH,CRITICAL
        exit-code: "1"
        ignore-unfixed: true
  
  dast: 
    runs-on: ubuntu-latest 
    needs: image-scan


    steps: 
    - name: Start Juice Shop 
      runs: | 
        docker run -d \
          --name juice-shop \ 
          -p 3000:3000 \
          bkimminich/juice-shop:latest
    
    - name: Wait for Juice Shop
      run: |
        for i in {1..30}; do 
          curl -f http://localhost:3000 && break
          sleep 2
        done 

    - name: Run ZAP Baseline Scan 
      uses: zaproxy/action-baseline@0.12.0
      with:
        target: "http://host.docker.internal:3000"